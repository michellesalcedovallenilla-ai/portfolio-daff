name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# El token del propio flujo basta para activar y publicar Pages,
# asi que no hace falta ninguna credencial personal.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, que gane el ultimo sin cancelar
# una publicacion a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5
        with:
          # activa Pages en el repositorio si aun no lo estaba
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
